<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beleggingsdashboard - David Buysse</title>
<style>
:root{--bg:#f4f7fb;--panel:#fff;--ink:#14213d;--muted:#667085;--line:#e5eaf1;--blue:#005eb8;--cyan:#eaf4ff;--green:#16803c;--red:#c62828;--orange:#b45309}
*{box-sizing:border-box}body{margin:0;font:14px Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--bg)}header{background:linear-gradient(105deg,#003b70,#0067b9);color:white;padding:24px 32px}header h1{margin:0 0 5px;font-size:27px}header p{margin:0;opacity:.82}nav{position:sticky;top:0;z-index:3;background:white;border-bottom:1px solid var(--line);padding:0 28px;display:flex;gap:8px;overflow:auto}nav button{border:0;background:none;padding:15px 14px;font-weight:600;color:#536174;cursor:pointer;border-bottom:3px solid transparent}nav button.active{color:var(--blue);border-color:var(--blue)}main{max-width:1500px;margin:22px auto;padding:0 22px}.tab{display:none}.tab.active{display:block}.filtertiles{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 16px}.tile{border:1px solid var(--line);background:white;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700;color:#42526a}.tile.active{background:#005eb8;color:white;border-color:#005eb8}.riskgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.riskbox{padding:14px;border-radius:10px;background:#f8fafc}.riskbox strong{display:block;font-size:20px;margin-top:5px}
</style>
</head>
<body>
<header>
  <h1>Beleggingsdashboard</h1>
  <p>Gegevens laden uit Google Sheet…</p>
</header>
<nav id="navTabs"></nav>
<main></main>
<script>
const GOOGLE_SHEET_ID='1xbwy0ctbmQ4yeoY_hKyNIpG0tWT7m_ubh4rd2j-3b9k';
const GOOGLE_SHEET_TAB='Dashboard';
const GOOGLE_SHEET_CSV=`https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(GOOGLE_SHEET_TAB)}`;
let R=[];
function parseCSV(text){
  const rows=[];let row=[],cell='',quoted=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(quoted){if(ch==='"'&&text[i+1]==='"'){cell+='"';i++;}else if(ch==='"')quoted=false;else cell+=ch;}
    else if(ch==='"')quoted=true;
    else if(ch===','){row.push(cell);cell='';}
    else if(ch==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell='';}
    else cell+=ch;
  }
  if(cell||row.length){row.push(cell.replace(/\r$/,''));rows.push(row);}
  return rows;
}
function numberValue(v,percent=false){
  if(v===null||v===undefined||String(v).trim()==='')return 0;
  let raw=String(v).trim(),isPct=raw.includes('%'),x=raw.replace(/[^0-9,.-]/g,'');
  const comma=x.lastIndexOf(','),dot=x.lastIndexOf('.');
  if(comma>=0&&dot>=0){const dec=comma>dot?',':'.',th=dec===','?'.':',';x=x.split(th).join('').replace(dec,'.');}
  else if(comma>=0){const parts=x.split(',');x=(parts.length===2&&parts[1].length<=4)?parts[0]+'.'+parts[1]:parts.join('');}
  else if(dot>=0){const parts=x.split('.');if(parts.length>2)x=parts.join('');}
  const n=Number(x);if(!Number.isFinite(n))return 0;return (percent||isPct)&&Math.abs(n)>1?n/100:n;
}
function positionsFromCSV(text){
  const rows=parseCSV(text);if(rows.length<2)throw new Error('Het tabblad bevat geen gegevens.');
  const headers=rows[0].map(x=>String(x).trim());
  const col=name=>headers.indexOf(name), all=name=>headers.map((x,i)=>x===name?i:-1).filter(i=>i>=0);
  const hashes=all('#');
  const required=['PORTEFEUILLE','POSITIE','Aankoopkoers','Koers','Dag %','ISIN','Rend. %','Order:','x price','Segment','CF','Advies','Aankoop €','Waarde €','Winst €'];
  const missing=required.filter(x=>col(x)<0);if(hashes.length<2)missing.push('# (positie en order)');
  if(missing.length)throw new Error('Ontbrekende kolommen: '+missing.join(', '));
  return rows.slice(1).filter(r=>r[col('PORTEFEUILLE')]&&r[col('POSITIE')]).map(r=>({
    positie:String(r[col('POSITIE')]||'').trim(),isin:String(r[col('ISIN')]||'').trim(),port:String(r[col('PORTEFEUILLE')]||'').trim(),
    qty:numberValue(r[hashes[0]]),buy:numberValue(r[col('Aankoopkoers')]),price:numberValue(r[col('Koers')]),day:numberValue(r[col('Dag %')],true),
    value:numberValue(r[col('Waarde €')]),profit:numberValue(r[col('Winst €')]),ret:numberValue(r[col('Rend. %')],true),
    segment:String(r[col('Segment')]||'').trim(),cf:numberValue(r[col('CF')]),advies:String(r[col('Advies')]||'').trim(),
    order:String(r[col('Order:')]||'').trim(),orderqty:numberValue(r[hashes[1]]),orderprice:r[col('x price')]||'',
    purchase:numberValue(r[col('Aankoop €')]),valueCurrency:numberValue(r[col('Waarde Valuta')]),link:'',market:'',symbol:'',tv:''
  }));
}
(async function loadPortfolio(){
  const hdr=document.querySelector('header p');
  const stamp=d=>new Intl.DateTimeFormat('nl-BE',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(d).replace(' om ',' · ');
  hdr.textContent='Gegevens laden uit Google Sheet…';
  try{
    const res=await fetch(GOOGLE_SHEET_CSV,{cache:'no-store'});
    if(!res.ok)throw new Error('Google gaf HTTP '+res.status+'. Controleer de deelinstellingen.');
    R=positionsFromCSV(await res.text());
    if(!R.length)throw new Error('Geen posities gevonden in tabblad '+GOOGLE_SHEET_TAB+'.');
    hdr.textContent='Live uit Google Sheet · geladen '+stamp(new Date());
    const script=document.createElement('script');script.textContent=document.getElementById('app').textContent;document.body.appendChild(script);
  }catch(err){
    console.error('Google Sheet kon niet worden geladen:',err);
    hdr.textContent='Google Sheet niet bereikbaar';
    document.querySelector('main').innerHTML='<div class="card"><h2>Portefeuilledata niet beschikbaar</h2><p>Controleer of het Google Sheet minstens toegankelijk is voor iedereen met de link en of het tabblad <b>Dashboard</b> heet.</p><p><small>'+String(err.message||err)+'</small></p></div>';
  }
})();
</script>
<script type="text/plain" id="app">
// Dashboard UI logica en weergave
const eur=n=>new Intl.NumberFormat('nl-BE',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n||0);
const pct=n=>new Intl.NumberFormat('nl-BE',{style:'percent',minimumFractionDigits:1,maximumFractionDigits:1}).format(n||0);
const n2=n=>new Intl.NumberFormat('nl-BE',{minimumFractionDigits:0,maximumFractionDigits:2}).format(n||0);

// Tabs opbouwen
const tabs=[{id:'overzicht',label:'Overzicht'},{id:'posities',label:'Posities'},{id:'orders',label:'Orders & Acties'},{id:'analyse',label:'Analyse & Moat'}];
document.getElementById('navTabs').innerHTML=tabs.map(t=>`<button class="${t.id==='overzicht'?'active':''}" onclick="switchTab('${t.id}')">${t.label}</button>`).join('');

function switchTab(id){
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// Basisweergave vullen
const main=document.querySelector('main');
main.innerHTML=tabs.map(t=>`<div id="${t.id}" class="tab ${t.id==='overzicht'?'active':''}"></div>`).join('');

// Overzicht vullen met data uit R
function renderOverzicht(){
  const totVal=R.reduce((s,r)=>s+r.value,0);
  const totCost=R.reduce((s,r)=>s+r.purchase,0);
  const totProfit=totVal-totCost;
  const totRet=totCost>0?totProfit/totCost:0;

  document.getElementById('overzicht').innerHTML=`
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px;margin-bottom:20px;">
      <div style="background:white;padding:18px;border-radius:10px;border:1px solid #e5eaf1;">
        <div style="color:#667085;font-weight:600;">Totale Waarde</div>
        <div style="font-size:24px;font-weight:700;margin-top:5px;">${eur(totVal)}</div>
      </div>
      <div style="background:white;padding:18px;border-radius:10px;border:1px solid #e5eaf1;">
        <div style="color:#667085;font-weight:600;">Totale Winst</div>
        <div style="font-size:24px;font-weight:700;margin-top:5px;color:${totProfit>=0?'var(--green)':'var(--red)'};">${eur(totProfit)} (${pct(totRet)})</div>
      </div>
    </div>
  `;
}

function renderPosities(){
  document.getElementById('posities').innerHTML=`
    <div style="background:white;padding:20px;border-radius:10px;border:1px solid #e5eaf1;overflow:auto;">
      <table style="width:100%;border-collapse:collapse;text-align:left;">
        <thead>
          <tr style="border-bottom:2px solid #e5eaf1;color:#667085;">
            <th style="padding:10px;">Portefeuille</th>
            <th style="padding:10px;">Positie</th>
            <th style="padding:10px;text-align:right;">Koers</th>
            <th style="padding:10px;text-align:right;">Dag %</th>
            <th style="padding:10px;text-align:right;">Waarde €</th>
            <th style="padding:10px;text-align:right;">Rend. %</th>
          </tr>
        </thead>
        <tbody>
          ${R.map(r=>`
            <tr style="border-bottom:1px solid #e5eaf1;">
              <td style="padding:10px;">${r.port}</td>
              <td style="padding:10px;font-weight:600;">${r.positie}</td>
              <td style="padding:10px;text-align:right;">${n2(r.price)}</td>
              <td style="padding:10px;text-align:right;color:${r.day>=0?'var(--green)':'var(--red)'};">${pct(r.day)}</td>
              <td style="padding:10px;text-align:right;">${eur(r.value)}</td>
              <td style="padding:10px;text-align:right;color:${r.ret>=0?'var(--green)':'var(--red)'};">${pct(r.ret)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

renderOverzicht();
renderPosities();
</script>
</body>
</html>
